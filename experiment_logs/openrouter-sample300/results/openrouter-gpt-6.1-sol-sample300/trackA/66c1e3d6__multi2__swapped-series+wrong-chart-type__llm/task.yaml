id: 66c1e3d6__multi2__swapped-series+wrong-chart-type__llm
family: debug_repair
instruction: 'chart.py builds a chart from the data in table.csv and saves it as output.png.

  The chart it currently produces is not faithful to that data: at least one thing

  about it contradicts what table.csv contains or what summary.txt says the chart

  shows. chart_current.png is how the chart looks right now.


  Find what is wrong, fix chart.py, and run it so that output.png shows a chart

  that is faithful to the data. Change only what is actually wrong and leave the

  rest of the chart as it is. Call finish when you are done.


  Diagnosis: the chart carries 2 flaws: (1) two series plot each other''s data; (2)

  the chart or a series uses a chart type that contradicts summary.txt. Repair

  exactly those.

  '
horizon_hint: 6
step_budget: 14
max_turns: 6
step_timeout_s: 90
wall_time_s: 1800
workspace_files:
- chart.py
- table.csv
- summary.txt
- chart_current.png
subgoals:
- id: code_valid
  desc: The script runs and writes output.png
  weight: 1.0
  verifiers:
  - type: execution
    params:
      produces: output.png
- id: flaw_fixed
  desc: The contradiction with the data is gone
  weight: 1.0
  verifiers:
  - type: vlm_judge
    params:
      candidate: output.png
      rubric: 'All 2 of the following now hold: (1) The chart uses the chart type
        that summary.txt describes. (2) Each series plots its own data from table.csv,
        not another series'' values.'
- id: visual_quality
  desc: The chart is legible and well formed
  weight: 1.0
  verifiers:
  - type: vlm_judge
    params:
      candidate: output.png
      rubric: 'Judge only the legibility and presentation of this chart, not whether
        its numbers or labels are factually right. It passes if a reader can take
        it in without effort: title, axis labels, tick labels and legend are all readable
        and none are clipped by the figure edge, overlapping each other, or covering
        the plotted data; text is large enough to read; the plotted data is visible
        rather than obscured or squeezed into a corner; nothing is drawn as a missing-glyph
        box. It fails if any of those is violated, however correct the content is.'

[project]
name = "chartsandbox"
version = "0.1.0"
description = "Sandbox runtime for a long-horizon chart-agent benchmark (built on ChartNet task instances)"
requires-python = ">=3.10"
dependencies = [
    # model backends — imported lazily, so only the one you run needs to work
    "anthropic>=0.69",
    "openai>=1.40",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pillow>=9.0",
    "numpy>=1.23",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "plotly>=5.0",
]

[project.scripts]
chartsandbox = "chartsandbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chartsandbox"]

id: reproduce_edit_01
family: reproduce_edit
instruction: |
  Reproduce the reference chart, then edit it.
  
  Chart type: Kernel Density Estimate Plot (library: seaborn).
  Summary of the target chart:
  This image presents a kernel density estimate (KDE) plot illustrating the distribution of credit bureau coverage in Bolivia from 2008 to 2014. The chart compares two sources of credit data: Private Bureau and Public Registry, each represented by distinct colors—blue for the Private Bureau and red for the Public Registry.
  
  The x-axis denotes the percentage of the adult population covered, ranging from 0% to 50%. The y-axis represents the density, indicating how frequently various coverage percentages occur within the dataset. The Private Bureau's coverage distribution, shown in blue, spans from
  
  Step 1: produce the chart and save it as out.png.
  Step 2: prepend 'EDITED: ' to the chart title and save out.png again.
  data.csv holds the underlying data.
horizon_hint: 8
step_budget: 20
workspace_files: [data.csv]
subgoals:
  - id: reproduce_base
    desc: Base chart reproduced and saved as out.png
    weight: 0.6
    verifiers:
      - type: execution
        params: {produces: out.png}
      - type: vlm_judge
        params: {candidate: out.png, rubric: "chart matches the described Kernel Density Estimate Plot"}
  - id: apply_edit
    desc: Title edited (prefixed with 'EDITED:')
    weight: 0.4
    verifiers:
      - type: execution
        params: {produces: out.png}
      - type: vlm_judge
        params: {candidate: out.png, rubric: "chart title now begins with 'EDITED:'"}
